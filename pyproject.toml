[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilemppi"
version = "0.1.0"
description = "16,384-Parallel-Universe Real-Time Robotics Control Engine in NVIDIA cuTile with 32 MB L2 Cache Residency"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Arrhat Nag", email = "arrhatnag1@gmail.com" },
]
keywords = [
    "robotics",
    "mppi",
    "cuda",
    "cutile",
    "cuda-tile",
    "triton",
    "gpu",
    "model-predictive-control",
    "optimal-control",
    "quadrotor",
    "quadruped",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]
gpu = [
    "torch>=2.3",
]
triton = [
    "triton>=3.0; sys_platform == 'linux'",
]
cutile = [
    "cuda-tile>=1.0.0; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit[toml]>=1.7.9",
    "build>=1.2",
    "twine>=5.1",
    "pyyaml>=6.0",
]

[project.scripts]
tilemppi = "tilemppi.cli:app"

[project.urls]
Homepage = "https://github.com/samudragupto/tilemppi"
Repository = "https://github.com/samudragupto/tilemppi"
Issues = "https://github.com/samudragupto/tilemppi/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tilemppi = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # Handled by formatter / math docstrings
    "B008",    # Typer/FastAPI function calls in argument defaults
    "RUF001",  # Mathematical symbols in docstrings/SVG labels
    "RUF002",  # Mathematical symbols in docstrings
    "RUF003",  # Mathematical symbols in comments
]

[tool.ruff.lint.per-file-ignores]
"src/tilemppi/kernels/cutile/*.py" = ["B007", "SIM108"]
"src/tilemppi/kernels/triton_backend.py" = ["B007", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
files = ["src/tilemppi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "gpu: requires CUDA GPU hardware",
    "triton: requires OpenAI Triton and CUDA GPU",
    "cutile_hw: requires native NVIDIA cuda.tile hardware (Compute Capability >= 10.0)",
    "gpu_perf: GPU performance benchmark tests",
]

[tool.coverage.run]
source = ["tilemppi"]
branch = false
omit = [
    "src/tilemppi/kernels/triton_backend.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "frontend", ".venv"]
skips = ["B101", "B311"]

