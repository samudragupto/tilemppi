name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-and-security:
    name: Lint, Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
      - name: Ruff format & lint
        run: |
          ruff format --check .
          ruff check .
      - name: Mypy strict typecheck
        run: mypy src/tilemppi
      - name: Bandit security scan
        run: bandit -c pyproject.toml -r src/tilemppi

  test-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with server & dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
      - name: Run pytest with coverage (>=85%)
        run: pytest --cov=tilemppi --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

  test-torch-backend:
    name: PyTorch CPU Backend Parity & Control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch CPU and TileMPPI
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[server,dev]"
      - name: Run backend parity & closed-loop control tests
        run: pytest tests/test_backends_parity.py tests/test_closed_loop_control.py -v

  cutile-verify-and-bench:
    name: cuTile AST Verification & Quick Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TileMPPI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
      - name: Hardware info, cuTile verify, demo & quick benchmark
        run: |
          tilemppi info
          tilemppi verify-cutile
          tilemppi demo --steps 40
          tilemppi benchmark --quick --output artifacts/bench.json --markdown artifacts/bench.md
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cutile-benchmark-artifacts
          path: artifacts/

  test-frontend:
    name: Frontend (Node 20) Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, test & build
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-package:
    name: Build & Verify Wheel/SDist
    runs-on: ubuntu-latest
    needs: [lint-and-security, test-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distribution and verify with twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install built wheel in isolated venv and run CLI
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/tilemppi info

